<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Seasons — Searles Family Trips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ruby:#C23B3B;--ruby-tint:rgba(194,59,59,0.10);--ruby-border:rgba(194,59,59,0.22);
  --pine:#2E7D52;--pine-tint:rgba(46,125,82,0.10);--pine-border:rgba(46,125,82,0.22);
  --river:#2B6CB0;--river-tint:rgba(43,108,176,0.10);--river-border:rgba(43,108,176,0.22);
  --ink:#1A2332;--ink-soft:#2C3A4E;--muted:#6E6558;--border:#E2DDD6;--mist:#F6F4F0;--paper:#FDFCFA;
  --amber:#C47B20;--amber-tint:rgba(196,123,32,0.10);
  --font-display:'Cormorant Garamond',Georgia,serif;
  --font-ui:'Outfit',system-ui,sans-serif;
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:20px;
}
body{font-family:var(--font-ui);background:var(--mist);color:var(--ink);min-height:100vh}
header{
  background:radial-gradient(ellipse 55% 60% at 15% 50%,rgba(194,59,59,0.10) 0%,transparent 70%),
             radial-gradient(ellipse 45% 55% at 85% 30%,rgba(43,108,176,0.10) 0%,transparent 70%),
             var(--ink);
  padding:20px 24px 16px;
  box-shadow:0 2px 12px rgba(26,35,50,0.25);
}
.header-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.leaf-logo-svg{animation:leafDrop 0.42s cubic-bezier(0.34,1.4,0.64,1) forwards;flex-shrink:0;object-fit:contain;mix-blend-mode:lighten}
.brand-text{display:flex;flex-direction:column;gap:2px}
.brand-name-text{font-family:var(--font-display);font-size:24px;font-weight:600;color:#FDFCFA;letter-spacing:0.10em;text-transform:uppercase;line-height:1;animation:brandFadeUp 0.36s ease-out 0.18s both}
.brand-bar{width:36px;height:3px;background:linear-gradient(to right,var(--ruby),var(--pine),var(--river));border-radius:2px;margin-top:6px;animation:brandFadeUp 0.36s ease-out 0.22s both}
.brand-tagline-text{font-family:var(--font-ui);font-size:10px;font-weight:400;color:rgba(253,252,250,0.38);letter-spacing:0.16em;text-transform:uppercase;animation:brandFadeUp 0.32s ease-out 0.28s both}
@keyframes leafDrop{from{opacity:0;transform:scale(0.82) translateY(-8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes brandFadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.page{max-width:960px;margin:0 auto;padding:36px 20px 64px}
.section-title{font-family:var(--font-ui);font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.10em;margin-bottom:18px}
.trips-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.trip-card{background:var(--paper);border-radius:var(--radius-lg);border:1.5px solid var(--border);box-shadow:0 2px 14px rgba(26,35,50,0.08);overflow:hidden;transition:transform 0.2s,box-shadow 0.2s;text-decoration:none;color:inherit;display:flex;flex-direction:column}
.trip-card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(26,35,50,0.14)}
.trip-card-banner{height:6px;background:linear-gradient(90deg,var(--ruby),var(--pine),var(--river))}
.trip-card-body{padding:18px 18px 14px;flex:1;display:flex;flex-direction:column;gap:10px}
.trip-card-title{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--ink);line-height:1.3;letter-spacing:0.01em}
.trip-card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.trip-meta-pill{font-family:var(--font-ui);font-size:11px;font-weight:500;color:var(--muted);background:var(--mist);padding:3px 10px;border-radius:20px;border:1px solid var(--border)}
.trip-destinations{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.dest-tag{font-family:var(--font-ui);font-size:10.5px;font-weight:600;color:var(--ruby);background:var(--ruby-tint);padding:3px 9px;border-radius:20px}
.trip-card-footer{padding:0 18px 18px}
.view-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:11px;background:var(--ink);color:#FDFCFA;border:none;border-radius:var(--radius-md);font-family:var(--font-ui);font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;transition:background 0.2s;letter-spacing:0.02em}
.view-btn:hover{background:var(--ink-soft)}
.add-card{background:transparent;border:2px dashed var(--border);border-radius:var(--radius-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:44px 20px;cursor:pointer;transition:all 0.2s;text-decoration:none;color:var(--muted);min-height:200px}
.add-card:hover{border-color:var(--ruby);color:var(--ruby);background:var(--ruby-tint)}
.add-icon{width:44px;height:44px;border-radius:50%;background:rgba(194,59,59,0.08);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--ruby);transition:background 0.2s}
.add-card:hover .add-icon{background:rgba(194,59,59,0.18)}
.add-label{font-family:var(--font-display);font-size:16px;font-weight:600;letter-spacing:0.01em}
.add-sub{font-family:var(--font-ui);font-size:12px;opacity:0.7;text-align:center}
@media(max-width:480px){header{padding:14px 14px 12px}.page{padding:20px 12px 48px}}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <img src="leaf-logo.png" class="leaf-logo-svg" width="36" height="42" alt="Seasons leaf logo">
      <div class="brand-text">
        <span class="brand-name-text">Seasons</span>
        <div class="brand-bar"></div>
      </div>
    </div>
    <span class="brand-tagline-text">Searles Family Trips</span>
  </div>
</header>
<div class="page">
  <div class="section-title">Upcoming &amp; Recent Trips</div>
  <div class="trips-grid">
    <a class="trip-card" href="las-vegas-utah.html">
      <div class="trip-card-banner"></div>
      <div class="trip-card-body">
        <div class="trip-card-title">Las Vegas &amp; Southern Utah Road Trip</div>
        <div class="trip-card-meta">
          <span class="trip-meta-pill">Jun 6&ndash;10, 2026</span>
          <span class="trip-meta-pill">5 Days</span>
        </div>
        <div class="trip-destinations">
          <span class="dest-tag">Zion NP</span>
          <span class="dest-tag">Bryce Canyon</span>
          <span class="dest-tag">Capitol Reef</span>
          <span class="dest-tag">Las Vegas</span>
          <span class="dest-tag">Valley of Fire</span>
        </div>
      </div>
      <div class="trip-card-footer">
        <span class="view-btn">View Itinerary &rarr;</span>
      </div>
    </a>
    <a class="add-card" href="#" onclick="alert('Coming soon!');return false">
      <div class="add-icon">+</div>
      <div class="add-label">Add a New Trip</div>
      <div class="add-sub">Plan your next adventure</div>
    </a>
  </div>
</div>
</body>
</html>
