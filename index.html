<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>My Trips</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --sand:#F5F0E8;--rust:#C1512D;--rust-dark:#9E3E1F;
  --cream:#FFFDF7;--orange:#E07B39;--green:#5A8A5A;
  --text:#2C1A0E;--text-light:#6B4D38;--border:#DDD5C5;
  --shadow:0 2px 16px rgba(44,26,14,0.12);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--sand);color:var(--text);min-height:100vh}
header{background:var(--rust);color:white;padding:22px 20px 18px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.25)}
header h1{font-size:clamp(20px,5vw,28px);font-weight:700;letter-spacing:0.3px}
header p{font-size:clamp(12px,2.5vw,14px);opacity:0.88;margin-top:4px}
.page{max-width:860px;margin:0 auto;padding:32px 16px 60px}
.section-title{font-size:13px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:1px;margin-bottom:16px}
.trips-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.trip-card{background:var(--cream);border-radius:16px;border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;transition:transform 0.2s,box-shadow 0.2s;text-decoration:none;color:inherit;display:flex;flex-direction:column}
.trip-card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(44,26,14,0.16)}
.trip-card-banner{height:8px;background:linear-gradient(90deg,var(--rust),var(--orange))}
.trip-card-banner.green{background:linear-gradient(90deg,#3A7A3A,#5A8A5A)}
.trip-card-banner.blue{background:linear-gradient(90deg,#2E63A8,#4A7EC7)}
.trip-card-body{padding:18px 18px 16px;flex:1;display:flex;flex-direction:column;gap:10px}
.trip-card-title{font-size:clamp(15px,3.5vw,17px);font-weight:700;color:var(--text);line-height:1.3}
.trip-card-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.trip-meta-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--text-light);background:var(--sand);padding:3px 10px;border-radius:20px;border:1px solid var(--border)}
.trip-destinations{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.dest-tag{font-size:11px;font-weight:600;color:var(--rust);background:rgba(193,81,45,0.10);padding:3px 9px;border-radius:20px}
.trip-card-footer{padding:0 18px 18px}
.view-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:11px;background:var(--rust);color:white;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;transition:background 0.2s;font-family:inherit}
.view-btn:hover{background:var(--rust-dark)}
.add-card{background:transparent;border:2px dashed var(--border);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px 20px;cursor:pointer;transition:all 0.2s;text-decoration:none;color:var(--text-light);min-height:200px}
.add-card:hover{border-color:var(--rust);color:var(--rust);background:rgba(193,81,45,0.04)}
.add-icon{width:44px;height:44px;border-radius:50%;background:rgba(193,81,45,0.10);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--rust);transition:background 0.2s}
.add-card:hover .add-icon{background:rgba(193,81,45,0.18)}
.add-label{font-size:14px;font-weight:600}
.add-sub{font-size:12px;opacity:0.75;text-align:center}
@media(max-width:480px){.page{padding:20px 12px 48px}}
</style>
</head>
<body>
<header>
  <h1>My Trips</h1>
  <p>Your personal travel itineraries</p>
</header>
<div class="page">
  <div class="section-title">Upcoming &amp; Recent Trips</div>
  <div class="trips-grid">

    <!-- Las Vegas & Utah Trip -->
    <a class="trip-card" href="las-vegas-utah.html">
      <div class="trip-card-banner"></div>
      <div class="trip-card-body">
        <div class="trip-card-title">Las Vegas &amp; Southern Utah Road Trip</div>
        <div class="trip-card-meta">
          <span class="trip-meta-pill">&#9679; Jun 6&ndash;10, 2026</span>
          <span class="trip-meta-pill">5 Days</span>
        </div>
        <div class="trip-destinations">
          <span class="dest-tag">Zion NP</span>
          <span class="dest-tag">Bryce Canyon</span>
          <span class="dest-tag">Capitol Reef</span>
          <span class="dest-tag">Las Vegas</span>
          <span class="dest-tag">Valley of Fire</span>
        </div>
      </div>
      <div class="trip-card-footer">
        <span class="view-btn">View Itinerary &#8594;</span>
      </div>
    </a>

    <!-- Add New Trip -->
    <a class="add-card" href="#" onclick="alert('Create a new trip by duplicating the template. Coming soon!');return false">
      <div class="add-icon">+</div>
      <div class="add-label">Add a New Trip</div>
      <div class="add-sub">Plan your next adventure</div>
    </a>

  </div>
</div>
</body>
</html>
